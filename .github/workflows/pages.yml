name: Deploy gokart web build

# Publishes web/ to GitHub Pages. The first run enables Pages itself
# (actions/configure-pages with enablement: true), so no manual setting is needed.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be enabled once by hand (Settings -> Pages -> Source: GitHub Actions).
      # `enablement: true` cannot do it here: creating a Pages site needs repository-admin
      # rights, which the workflow's GITHUB_TOKEN does not have.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
