# A Formula Student car's wheelbase and steering lock, for the traced competition layouts (decision 0032). Their
# hairpins, 9 m across at the outside by the rules, bend the centreline to a radius near 3 m, tighter than the default
# 2.6 m wheelbase can steer; 1.53 m and 0.6 rad turn a 2.25 m radius. For the kinematic bicycle: the dynamic and
# four-wheel cars keep their own geometry and refuse a wheelbase shorter than their centre of gravity's distance.
# Pure Pursuit aims 2.5 m ahead plus a quarter second of travel, not 4 m: on courses 3 m wide the longer aim cut
# corners into the cones (FSG23: 9 cones down at 4 m, 1 at 3 m, none at 2.5 m; FSE24: 4, 0, 0), for 0.3 s of lap.
schema_version=1
wheelbase_m=1.53
max_steering_rad=0.6
lookahead_base_m=2.5
